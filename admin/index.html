<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Administrador Music NFC</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>🎵 Music NFC Admin</h1>

<label>Artista</label>

<input id="artist" type="text">

<label>Álbum</label>

<input id="album" type="text">

<label>Enlace de Spotify</label>

<input id="spotify" type="text">

<label>Portada</label>

<input id="cover" type="file" accept="image/*">

<img id="preview">

<button id="generate">

Generar

</button>

<hr>

<h3>Nombre del archivo</h3>

<pre id="filename"></pre>

<h3>URL del NFC</h3>

<pre id="url"></pre>

<h3>JSON</h3>

<pre id="json"></pre>

<div class="buttons">

<button id="copyJson">

Copiar JSON

</button>

<button id="copyUrl">

Copiar URL

</button>

</div>

</div>

<script src="app.js"></script>

</body>

</html>
